name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The go.mod floor, the versions in between, and current stable.
        go: ['1.23', '1.24', '1.25', 'stable']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Verify formatting
        # Only on one version: gofmt output can differ between releases.
        if: matrix.go == 'stable'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        if: matrix.go == 'stable'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go build ./...

      - run: go vet ./...

      - run: go test -race -cover ./...
